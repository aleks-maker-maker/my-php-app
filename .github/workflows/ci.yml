name: PHP CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: my-php-app

jobs:
  lint:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Validate Composer files
        run: composer validate --strict

      - name: Check PHP syntax
        shell: bash
        run: git ls-files -z -- '*.php' | xargs -0 -r -n 1 php -l

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP and Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: dom, mbstring, xml, xmlwriter
          tools: composer:v2
          coverage: none

      - name: Install locked dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit tests
        run: vendor/bin/phpunit --configuration phpunit.xml

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image
        run: |
          docker save -o "$RUNNER_TEMP/docker-image.tar" "$IMAGE_NAME:latest"
          gzip "$RUNNER_TEMP/docker-image.tar"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: ${{ runner.temp }}/docker-image.tar.gz
          retention-days: 7
          if-no-files-found: error

      - name: Test Docker image
        shell: bash
        run: |
          status=0
          docker run --rm --network none "$IMAGE_NAME:latest" > "$RUNNER_TEMP/greeting.txt" || status=$?
          printf 'Application exit code: %s\n' "$status"
          test "$status" -eq 0
          printf '%s\n' 'Hello from PHP in Docker! 🐳' | cmp - "$RUNNER_TEMP/greeting.txt"
          cat "$RUNNER_TEMP/greeting.txt"
          user=$(docker run --rm --network none "$IMAGE_NAME:latest" id -un)
          uid=$(docker run --rm --network none "$IMAGE_NAME:latest" id -u)
          test "$user" = appuser
          test "$uid" -gt 0
          printf 'Container user: %s, UID: %s\n' "$user" "$uid"
